[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jester-lsr"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "jester-core>=0.2.0,<0.3","jester-rm-client>=0.1,<1", "numpy>=1.26", "rich>=13"]

[project.optional-dependencies]
semantic = ["sentence-transformers>=3", "scikit-learn>=1.4"]
faiss = ["faiss-cpu>=1.8"]
windows-ml = ["onnxruntime-windowsml"]
test = ["pytest>=8", "jsonschema>=4,<5"]

[project.scripts]
jester-lsr = "lsr.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lsr = ["defaults.json", "resources/*.json"]
