# Use a shell runner with Python 3.11+ and development dependencies prepared.
# Native artifacts are built explicitly with the platform toolchain.

stages:
  - validate
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .cache/pip/

before_script:
  - python --version
  - python -m pip install --upgrade pip

validate:syntax:
  stage: validate
  script:
    - python -m compileall router.py src/lsr

validate:naming:
  stage: validate
  script:
    - python -c "from pathlib import Path; banned=('semantic'+'_router','Semantic'+'Router','Semantic'+' Router','semantic'+'-router','semantic'+' router'); allowed={'.py','.md','.yml','.yaml','.txt','.toml','.json'}; files=[p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in allowed and '.git' not in p.parts and '__pycache__' not in p.parts]; hits=[f'{p}:{text}' for p in files for text in banned if text in p.read_text(encoding='utf-8', errors='ignore')]; assert not hits, '\n'.join(hits)"

test:import:
  stage: test
  script:
    - python -B -c "import lsr, router; assert lsr.LSRRouter; assert router.LSRRouter"
